<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Countdown</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
}

body{

    display:flex;
    justify-content:center;
    align-items:center;

    background:#101010;
    overflow:hidden;

    font-family:Arial,Helvetica,sans-serif;
}

/* Main Display */

.screen{

    position:relative;

    width:min(900px,95vw);
    aspect-ratio:900/520;

    background:#050505;

    border:8px solid #181818;
    border-radius:20px;

    overflow:hidden;

    box-shadow:
        0 0 40px rgba(255,0,0,.25),
        inset 0 0 100px rgba(255,0,0,.05);

}

/* Scanlines */

.screen::before{

    content:"";

    position:absolute;
    inset:0;

    background:
        repeating-linear-gradient(
            transparent 0px,
            transparent 3px,
            rgba(255,255,255,.02) 4px
        );

    pointer-events:none;

}

/* Random flicker */

.screen::after{

    content:"";

    position:absolute;
    inset:0;

    background:rgba(255,0,0,.02);

    animation:flicker .15s infinite alternate;

    pointer-events:none;

}

@keyframes flicker{

from{opacity:.04;}
to{opacity:.15;}

}

/* Warning stripes */

.border{

    position:absolute;

    left:20px;
    right:20px;

    height:18px;

    background:
        repeating-linear-gradient(
            -45deg,
            #b00000 0px,
            #b00000 12px,
            #2c0000 12px,
            #2c0000 24px
        );

}

.top{top:20px;}
.bottom{bottom:20px;}

/* Symbol */

.emblem{

    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    width:260px;
    height:260px;

    border-radius:50%;

    border:5px solid rgba(255,0,0,.10);

}

.emblem:before,
.emblem:after{

content:"";

position:absolute;

left:50%;
top:50%;

width:4px;
height:240px;

background:rgba(255,0,0,.10);

transform:translate(-50%,-50%);

}

.emblem:after{

transform:translate(-50%,-50%) rotate(90deg);

}

.star{

position:absolute;

left:50%;
top:50%;

transform:translate(-50%,-50%) rotate(45deg);

width:170px;
height:170px;

border:4px solid rgba(255,0,0,.10);

}

/* Center Content */

.content{

position:absolute;

inset:0;

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

padding:30px;

text-align:center;

}

/* Timer */

#timer{

font-family:Consolas,monospace;

font-size:clamp(24px,6vw,60px);

color:#ff5555;

letter-spacing:.08em;

text-shadow:
0 0 8px red,
0 0 20px red,
0 0 45px #990000;

animation:textFlicker 2s infinite;

}

/* Subtitle */

.subtitle{

margin-top:18px;

font-size:clamp(14px,3vw,28px);

color:#ff7b7b;

text-shadow:0 0 10px red;

}

/* Text flicker */

@keyframes textFlicker{

0%,18%,22%,100%{opacity:1;}

20%{opacity:.45;}

21%{opacity:.15;}

}

/* Screen glitch */

.glitch{

animation:glitch .12s;

}

@keyframes glitch{

0%{transform:translateX(0);}
25%{transform:translateX(-4px);}
50%{transform:translateX(4px);}
75%{transform:translateX(-2px);}
100%{transform:translateX(0);}

}

</style>

</head>
<body>

<div class="screen" id="screen">

<div class="border top"></div>

<div class="border bottom"></div>

<div class="emblem">
<div class="star"></div>
</div>

<div class="content">

<div id="timer">
00:00:00:00:000
</div>

<div class="subtitle">
Nov 19
</div>

</div>

</div>

<script>

/*======================================================
 CHANGE ONLY THIS DATE

 new Date(year, month, day, hour, minute, second, ms)

 Months:
 January = 0
 December = 11
======================================================*/

const TARGET_DATE = new Date(2026,10,19,0,0,0,0);

/*======================================================*/

const timer=document.getElementById("timer");
const screen=document.getElementById("screen");

function update(){

let diff=TARGET_DATE-new Date();

if(diff<0) diff=0;

const days=Math.floor(diff/86400000);
diff%=86400000;

const hrs=Math.floor(diff/3600000);
diff%=3600000;

const mins=Math.floor(diff/60000);
diff%=60000;

const secs=Math.floor(diff/1000);

const ms=diff%1000;

timer.textContent=
String(days).padStart(2,"0")+":"+
String(hrs).padStart(2,"0")+":"+
String(mins).padStart(2,"0")+":"+
String(secs).padStart(2,"0")+":"+
String(ms).padStart(3,"0");

}

update();
setInterval(update,10);

/* Random glitch */

setInterval(()=>{

screen.classList.add("glitch");

setTimeout(()=>{

screen.classList.remove("glitch");

},120);

},3000+Math.random()*4000);

</script>

</body>
</html>
